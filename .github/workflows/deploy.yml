name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: production
        type: choice
        options:
          - staging
          - production
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Database migrate + seed (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup database (idempotent)
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL_POSTGRES is empty — set it on the GitHub Environment as a secret (direct postgresql:// URL)."
            exit 1
          fi
          pnpm db:setup
        env:
          # Direct Postgres for Prisma migrate/seed (not the Worker runtime URL).
          DATABASE_URL: ${{ secrets.DATABASE_URL_POSTGRES }}

  deploy:
    name: Deploy to Cloudflare Workers (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    needs: migrate
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full Prisma client + pg driver adapter on Workers (Accelerate may use generate:no-engine).
      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build OpenNext bundle (shim + pg-cloudflare fix)
        working-directory: apps/web
        run: chmod +x scripts/build-opennext.sh && ./scripts/build-opennext.sh
        env:
          WRANGLER_BUILD_PLATFORM: node
          WRANGLER_BUILD_CONDITIONS: ""
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync Worker secrets from GitHub
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL CRON_SECRET DASHBOARD_PASSWORD SESSION_SECRET; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name (repo-level or Environment $DEPLOY_ENV)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          printf '%s' "$DATABASE_URL" | pnpm exec wrangler secret put DATABASE_URL --env "$DEPLOY_ENV"
          printf '%s' "$CRON_SECRET" | pnpm exec wrangler secret put CRON_SECRET --env "$DEPLOY_ENV"
          printf '%s' "$DASHBOARD_PASSWORD" | pnpm exec wrangler secret put DASHBOARD_PASSWORD --env "$DEPLOY_ENV"
          printf '%s' "$SESSION_SECRET" | pnpm exec wrangler secret put SESSION_SECRET --env "$DEPLOY_ENV"

      - name: Deploy Worker
        working-directory: apps/web
        run: pnpm exec wrangler deploy --env ${{ github.event.inputs.environment || 'production' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  verify:
    name: Post-deploy verification (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    needs: deploy
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Polymarket Gamma API
        run: pnpm verify:gamma

      - name: Cloudflare smoke test
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "SMOKE_BASE_URL is empty — set Environment variable SMOKE_BASE_URL."
            exit 1
          fi
          pnpm smoke:cloudflare
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL || secrets.SMOKE_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
